spring.application.name=agendamento-back

# Profile ativo (use 'dev' para desenvolvimento local)
spring.profiles.active=${SPRING_PROFILE:prod}

# Configura??o do Hibernate
# validate = apenas valida o schema (Flyway gerencia as migrations)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
