spring.application.name=agendamento-back

# Profile ativo (use 'dev' para desenvolvimento local)
spring.profiles.active=${SPRING_PROFILE:dev}

# Configuração do Hibernate
# none = Flyway gerencia todas as migrations, Hibernate não valida
# Após Flyway executar V9, pode voltar para 'validate' se preferir
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
